# ==============================================================================
# Fallback H2 In-Memory Profile
# Activate by running with: --spring.profiles.active=h2
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Configuration for H2 Profile
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,mappings
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
