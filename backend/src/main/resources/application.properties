server.port=${PORT:8080}

# Application Name
spring.application.name=expense-tracker-backend

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
# JDBC Connection URL (auto-creates database 'expensedb' if not already present)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
# Connection timeout: 20 seconds before failing fast if database is unreachable
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=ExpenseTrackerHikariPool

# Disable Spring Boot DataSourceScriptDatabaseInitializer
# Tables are automatically created from @Entity classes via Hibernate
spring.sql.init.mode=never

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# Automatically creates and updates all tables from @Entity classes on startup
# Dialect is auto-detected dynamically by Hibernate based on active database (MySQL or H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Available if running in fallback mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================================
# Swagger / OpenAPI 3 Documentation Configuration
# ==============================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==============================================================================
# Colorized Console Logging Configuration
# ==============================================================================
# Enable ANSI color output across all terminals (Windows CMD, PowerShell, Terminal, IDEs)
spring.output.ansi.enabled=ALWAYS

# Console Pattern with custom ANSI colors:
# - %clr(%d{yyyy-MM-dd HH:mm:ss}){green} : Date & Time in GREEN
# - %clr([%thread]){blue}                : Thread name in BLUE
# - %clr(%-5level)                       : Dynamic Level Colors (RED for ERROR, YELLOW for WARN, GREEN for INFO, BLUE for DEBUG)
# - %clr(%-36logger{36}){cyan}           : Logger class name in CYAN / LIGHT BLUE
# - %clr(-){faint}                       : Delimiter in FAINT
# - %msg%n                               : Log message content
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){green} %clr([%thread]){blue} %clr(%-5level) %clr(%-36logger{36}){cyan} %clr(-){faint} %msg%n

# Logging Levels
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.web=INFO

# ==============================================================================
# Spring Boot Actuator System Monitoring Configuration
# ==============================================================================
# Base path for actuator endpoints (defaults to /actuator)
management.endpoints.web.base-path=/actuator

# Expose key monitoring endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics,env,loggers,beans,mappings

# Health Details: Show full component details (Database, Disk Space, Ping, etc.)
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Info & Metadata Configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.metrics.export.simple.enabled=true

# Application Info metadata exposed via /actuator/info
info.app.name=Expense Tracker API
info.app.description=Spring Boot 3 REST API for Personal Expense & Income Tracking with Actuator Monitoring
info.app.version=1.0.0
info.app.admin=itachi
info.app.support-email=itachi@gmail.com
info.app.security=Single-Admin Architecture (Administrator Itachi)
